# Shade configuration — lives at \EFI\shade\shade.conf on the ESP
# (or next to the Shade binary). Every key is optional.

timeout    = 5          # seconds before the default boots; -1 waits, 0 boots instantly
default    = last       # "last" (remember the previous choice) or a title glob, e.g. "Windows"
theme      = neutral    # folder under \EFI\shade\themes\
resolution = auto       # auto | max | 2560x1440
# scale    = 1.5        # UI scale; default is derived from screen height
hints      = true       # keyboard hint line at the bottom
clock      = true
# mouse-speed = 1.0
# connect-all = true    # connect every controller so USB sticks show up
# scan-nvram  = true    # merge firmware Boot#### entries
# log = debugcon        # debug output to I/O port 0xE9 (QEMU/Bochs only)

# Anything matching these rules never shows up. Values are case-insensitive
# globs; repeat a key for more rules. Ignored volumes are not even scanned.
[ignore]
# volume   = Games                                   # filesystem label
# partuuid = 1b6e9a2c-*                              # GPT partition GUID
# path     = \EFI\HP\*                               # loader path
# entry    = rEFInd                                  # tile title

# Kernel / loader command lines, keyed by tile title (glob).
[options]
# Linux = root=/dev/nvme0n1p3 rw quiet splash

# Custom entries: [entry.<id>]
# [entry.arch]
# title   = Arch Linux
# volume  = ESP                  # label glob; omit for Shade's own volume
# path    = \vmlinuz-linux
# options = root=UUID=... rw initrd=\initramfs-linux.img
# icon    = os-arch,os-linux
# order   = 95                   # higher sorts first (Windows is 100)

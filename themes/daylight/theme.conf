# DAYLIGHT — the light counterpart of Neutral. Only what differs is listed;
# everything else (shape, type, motion, icons) is inherited from Neutral.

[theme]
name        = Daylight
author      = Shade
description = Light monochrome, shadcn/ui-inspired

[palette]
bg            = #f5f5f5
surface       = #ffffff
raised        = #f4f4f5
border        = #e5e5e5
border-strong = #d4d4d4
fg            = #0a0a0a
fg-muted      = #525252
fg-subtle     = #a3a3a3
primary       = #171717
primary-fg    = #fafafa
danger        = #dc5b5e

[shadow]
blur     = 36
offset-y = 14
color    = #0000001f

[background]
glow     = #ffffff
vignette = 0.12

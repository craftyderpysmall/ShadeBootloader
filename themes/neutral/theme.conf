# NEUTRAL — monochrome dark, shadcn/ui-inspired. Shade's default theme.
# Every key is optional; anything a theme leaves out falls back to these values.
# Sizes are in pixels at 1x and scale with the display (see docs/THEMING.md).

[theme]
name        = Neutral
author      = Shade
description = Monochrome dark, shadcn/ui-inspired

[palette]
bg            = #0a0a0a   # desktop ground
surface       = #171717   # cards, bar, popups
raised        = #212121   # hover, selection plate, inputs
border        = #262626   # 1px card borders
border-strong = #404040   # focused borders
fg            = #fafafa   # primary text, icons
fg-muted      = #a1a1a1   # secondary text
fg-subtle     = #737373   # hints, disabled
primary       = #fafafa   # the one primary action per surface
primary-fg    = #171717   # text on primary
danger        = #e5787a
success       = #8ccf9a
warning       = #e6c879
info          = #82a9e0

[shape]
radius-card    = 16
radius-control = 10
radius-pill    = 999

[spacing]
gap = 8     # inner gap
pad = 16    # outer gap / card padding

[type]
font-regular  = builtin:Inter-Regular
font-semibold = builtin:Inter-SemiBold
size-title = 24
size-label = 15
size-body  = 13
size-small = 12

[layout]
tile-width  = 176
tile-height = 228
icon-size   = 88

[shadow]
blur     = 40
offset-y = 16
color    = #00000099

[motion]
enter-ms         = 320    # decelerate
exit-ms          = 160    # accelerate, about half of enter
spring-stiffness = 420    # "settle": ~2% overshoot, no visible bounce
spring-damping   = 0.78

[background]
glow     = #141414   # faint radial lift at the centre of the ground
vignette = 0.6

[icons]
tint = true   # icons are white masks recolored with fg / fg-muted
